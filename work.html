<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Rocket Effect Agency</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="nav">
    <a class="left" href="./">Rocket Effect Agency</a>
    <a class="center" href="work.html" aria-current="page">work</a>
    <nav class="right">
      <a href="mailto:info@wavefoundation.co">email</a>
      <a href="https://www.instagram.com/rocket.effect" target="_blank" rel="noopener">ig</a>
    </nav>
  </header>

  <!-- Freeform gallery. --x/--y/--w are % of the gallery width, --r is rotation in degrees.
       Items can be dragged around; a click without dragging opens the link. -->
  <main class="freeform" id="gallery">
    <a class="item" href="#" style="--x:40; --y:0; --w:32; --r:2; --z:1">
      <img src="assets/work/placeholder.png" alt="Project" width="1500" height="1000">
    </a>
    <a class="item" href="#" style="--x:3.06; --y:2.18; --w:32; --r:-3; --z:4">
      <img src="assets/work/placeholder.png" alt="Project" width="1500" height="1000">
    </a>
    <a class="item" href="https://www.instagram.com/p/DKe31iBRZjv/" target="_blank" rel="noopener" style="--x:69.37; --y:4.58; --w:29.29; --r:-1; --z:2">
      <img src="assets/work/strick-machine.jpg" alt="Strick – Machine cover art" width="1400" height="1400">
      <figcaption>Strick - Machine</figcaption>
    </a>
    <a class="item" href="#" style="--x:7.88; --y:14.62; --w:32; --r:-1; --z:5">
      <img src="assets/work/placeholder.png" alt="Project" width="1500" height="1000">
    </a>
    <a class="item" href="#" style="--x:40; --y:17.99; --w:32; --r:0; --z:3">
      <img src="assets/work/placeholder.png" alt="Project" width="1500" height="1000">
    </a>
  </main>

  <script>
    // Drag items around the canvas; the dragged item comes to the front.
    const gallery = document.getElementById('gallery');
    let front = 10;
    gallery.querySelectorAll('.item').forEach((item) => {
      let startX, startY, dx = 0, dy = 0, baseX = 0, baseY = 0, moved = false;
      item.addEventListener('pointerdown', (e) => {
        if (matchMedia('(max-width: 640px)').matches) return;
        e.preventDefault();
        item.setPointerCapture(e.pointerId);
        item.classList.add('dragging');
        item.style.zIndex = ++front;
        startX = e.clientX; startY = e.clientY; moved = false;
      });
      item.addEventListener('pointermove', (e) => {
        if (!item.classList.contains('dragging')) return;
        dx = e.clientX - startX; dy = e.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        item.style.translate = `${baseX + dx}px ${baseY + dy}px`;
      });
      const end = () => {
        if (!item.classList.contains('dragging')) return;
        item.classList.remove('dragging');
        baseX += dx; baseY += dy; dx = dy = 0;
      };
      item.addEventListener('pointerup', end);
      item.addEventListener('pointercancel', end);
      item.addEventListener('click', (e) => {
        if (moved || item.getAttribute('href') === '#') e.preventDefault();
        moved = false;
      });
    });
  </script>
</body>
</html>
