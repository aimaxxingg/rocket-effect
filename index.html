<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rocket effect marketing</title>
  <meta name="description" content="rocket effect marketing — press release, digital ads, content seeding, art, pr.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@800;900&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=60">
</head>
<body>
  <header class="nav">
    <a class="left" href="./" aria-label="rocket effect marketing"><svg class="logo" viewBox="0 0 753 510" aria-hidden="true"><circle cx="75" cy="75" r="75"/><circle cx="75" cy="135" r="75"/><circle cx="75" cy="195" r="75"/><circle cx="75" cy="255" r="75"/><circle cx="75" cy="315" r="75"/><circle cx="75" cy="375" r="75"/><circle cx="75" cy="435" r="75"/><rect x="0" y="0" width="323" height="142" rx="71"/><circle cx="293" cy="130" r="75"/><circle cx="293" cy="192" r="75"/><rect x="75" y="182" width="248" height="140" rx="70"/><circle cx="212" cy="345" r="75"/><circle cx="255" cy="392" r="75"/><circle cx="294" cy="435" r="75"/><circle cx="460" cy="75" r="75"/><circle cx="460" cy="135" r="75"/><circle cx="460" cy="195" r="75"/><circle cx="460" cy="255" r="75"/><circle cx="460" cy="315" r="75"/><circle cx="460" cy="375" r="75"/><circle cx="460" cy="435" r="75"/><rect x="386" y="0" width="367" height="142" rx="71"/><rect x="460" y="182" width="250" height="141" rx="70.5"/><rect x="386" y="365" width="367" height="142" rx="71"/></svg></a>
    <!-- On phones the links fold into a drop-down opened by the menu button. -->
    <div class="links" id="nav-links">
      <a class="center" href="#work" data-open="work" data-word>work</a>
      <nav class="right">
        <a href="#about" data-open="about" data-word>about</a>
        <a href="mailto:info@wavefoundation.co" id="email-link" data-word>email</a>
      </nav>
    </div>
    <button class="menu-btn" id="menu-btn" type="button" aria-label="menu" aria-expanded="false" aria-controls="nav-links">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </header>

  <!-- Hero: the words sit spread over the page and switch on/off one by one. -->
  <main class="hero" id="hero">
    <h1 class="sr-only">rocket effect marketing</h1>
    <a class="hero-word w1" href="#work" data-open="work" aria-label="rocket"></a>
    <a class="hero-word w2" href="#work" data-open="work" aria-label="effect"></a>
  </main>

  <!-- Folder overlay: used for work (tabs per category) and about. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- softens cut edges by a hair, like a paper edge -->
    <filter id="soft-edge" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.55" result="a"/>
      <feComposite in="SourceGraphic" in2="a" operator="in"/>
    </filter>
  </svg>
  <div class="overlay" id="overlay" aria-hidden="true">
    <!-- phones: the folders lie stacked, one per tab; tapping one pulls it out and opens it -->
    <div class="stack" id="stack"></div>
    <div class="folder-fade" aria-hidden="true"></div>
    <div class="folder" id="folder">
      <button class="to-stack" id="to-stack" type="button" aria-label="all folders"></button>
      <div class="back-tabs" id="back-tabs"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="sheet" id="sheet">
        <div class="board" id="board"></div>
        <article class="detail" id="detail" hidden></article>
        <div class="about-copy" id="about" hidden></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { buildWordSVG, loadFont } from './assets/blobfont.js';
    import { animateLetters } from './assets/hero-anim.js';

    // All content (texts, tabs, projects) lives in content.json, edited from /admin.
    // ?preview shows the unsaved draft from the admin panel (this browser only).
    let content;
    if (new URLSearchParams(location.search).has('preview')) {
      try { content = JSON.parse(localStorage.getItem('re-admin-draft')); } catch {}
    }
    const fontReady = loadFont();
    content ||= await fetch('content.json', { cache: 'no-cache' }).then((r) => r.json());
    await fontReady;
    const { site = {}, hero = [], heroLayout = {}, heroAnim = {}, tabs = [], projects = [], about = [] } = content;
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    if (site.title) document.title = site.title;
    if (site.description) document.querySelector('meta[name=description]').content = site.description;
    if (site.email) document.getElementById('email-link').href = 'mailto:' + site.email;
    document.querySelectorAll('.hero-word').forEach((a, i) => {
      if (hero[i]) a.setAttribute('aria-label', hero[i]); else a.remove();
    });

    const word = (text) => buildWordSVG(text, { line: true });

    // Header links drawn in the site lettering (text kept as aria-label).
    document.querySelectorAll('[data-word]').forEach((a) => {
      const label = a.textContent.trim();
      a.setAttribute('aria-label', label);
      // menu links keep the thinner dot lettering; the rest uses the typeface
      a.replaceChildren(a.closest('#nav-links') ? buildWordSVG(label, { line: true, dots: true }) : word(label));
    });

    // --- Phone menu: the three-line button opens the links as a drop-down -------
    const nav = document.querySelector('.nav');
    const menuBtn = document.getElementById('menu-btn');
    const setMenu = (open) => {
      if (open === nav.classList.contains('menu-open')) return;
      nav.classList.toggle('menu-open', open);
      menuBtn.setAttribute('aria-expanded', open);
    };
    menuBtn.addEventListener('click', () => setMenu(!nav.classList.contains('menu-open')));
    document.addEventListener('click', (e) => {
      if (e.target.closest('#nav-links a') || !e.target.closest('.nav')) setMenu(false);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
    document.querySelectorAll('#nav-links a').forEach((a, i) => a.style.setProperty('--i', i));

    // --- Hero: letters fade on one by one, then off one by one ---------------
    const heroWords = [...document.querySelectorAll('.hero-word')];
    heroWords.forEach((a) => a.appendChild(buildWordSVG(a.getAttribute('aria-label'), { line: true, letters: true })));
    const letters = heroWords.flatMap((w) => [...w.querySelectorAll('.ch')]);
    // Word positions from the admin panel: x, y in % of the screen, w = word width in % of screen width.
    const phoneHero = matchMedia('(max-width: 640px)');
    function placeHero() {
      const layout = heroLayout[phoneHero.matches ? 'phone' : 'desktop'] || [];
      heroWords.forEach((a, i) => {
        const l = layout[i];
        a.style.cssText = l ? `left:${l.x}vw; top:${l.y}vh; right:auto` : '';
        a.firstChild.style.width = l ? l.w + 'vw' : '';
        a.firstChild.style.height = l ? 'auto' : '';
      });
    }
    placeHero();
    phoneHero.addEventListener('change', placeHero);
    animateLetters(letters, heroAnim, heroWords);

    // --- Folder overlay ------------------------------------------------------
    const overlay = document.getElementById('overlay');
    const tabsEl = document.getElementById('tabs');
    const folderEl = document.getElementById('folder');
    const backTabs = document.getElementById('back-tabs');
    const board = document.getElementById('board');
    const detail = document.getElementById('detail');
    const aboutEl = document.getElementById('about');
    let mode = null;          // 'work' | 'about' | null
    let activeTab = tabs[0];
    let closeTimer, stackTimer;

    // About: the text, the instagram link, and a small credit at the foot of the folder.
    aboutEl.innerHTML = about.map((p) => `<p>${esc(p)}</p>`).join('');
    if (site.instagram) {
      const ig = document.createElement('a');
      ig.className = 'about-ig';
      ig.href = site.instagram;
      ig.target = '_blank';
      ig.rel = 'noopener';
      ig.setAttribute('aria-label', 'instagram');
      ig.appendChild(buildWordSVG('instagram', { line: true, dots: true }));
      aboutEl.appendChild(ig);
    }
    const credit = document.createElement('p');
    credit.className = 'about-credit';
    credit.setAttribute('aria-label', 'site by oiviid');
    const by = document.createElement('a');
    by.href = 'https://oiviid.com';
    by.target = '_blank';
    by.rel = 'noopener';
    by.setAttribute('aria-label', 'oiviid');
    by.appendChild(buildWordSVG('oiviid', { line: true, dots: true }));
    credit.append(buildWordSVG('site by ', { line: true, dots: true }), by);
    aboutEl.appendChild(credit);
    document.getElementById('to-stack').appendChild(word('back'));

    // Phones: the folders lie stacked on top of each other (STACK_ON_PHONE).
    // The older phone layout, tabs down the left side of one folder, is SIDE_TABS_ON_PHONE
    // (set STACK_ON_PHONE = false and SIDE_TABS_ON_PHONE = true to go back to it).
    const STACK_ON_PHONE = true;
    const SIDE_TABS_ON_PHONE = false;
    const phone = matchMedia('(max-width: 640px)');
    const sideTabs = () => SIDE_TABS_ON_PHONE && phone.matches;
    const useStack = () => STACK_ON_PHONE && phone.matches;
    const stackEl = document.getElementById('stack');
    const toStack = document.getElementById('to-stack');
    const stackX = {};   // tab -> left edge of its tab in the stack (px), so the opened folder's tab lines up
    const stackClip = {};   // tab -> its paper clip {x, color, tilt} (every other folder has one)
    // Paper clip (wire bent round three times), clipped over the folder's top edge.
    const CLIP_COLORS = ['#b8693f', '#5b9fd3', '#6f787b'];   // copper, blue, steel - as in the photo
    function clipEl({ x, color, tilt }) {
      const svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'clip');
      svg.setAttribute('viewBox', '0 0 20 58');
      svg.style.cssText = `left:${x}px; rotate:${tilt}deg; color:${color}`;
      const d = 'M7,16 V45 a3.5,3.5 0 0 0 7,0 V9 a5.5,5.5 0 0 0 -11,0 V47 a7,7 0 0 0 14,0 V19';
      svg.innerHTML = `<path d="${d}" stroke="currentColor" stroke-width="1.9"/>` +
        `<path d="${d}" stroke="#fff" stroke-opacity=".35" stroke-width=".6" transform="translate(-.45 -.3)"/>`;
      return svg;
    }

    // Folder tabs: clean outlines traced from the reference photo, filled with
    // the photo's own paper (assets/folder/paper.jpg, a seamless tile), no strokes.
    // Sizes are in photo pixels; --u is one photo pixel on screen.
    const PHOTO_W = 670;
    const TAB_H = 51;          // tab top to the folder body
    const MIN_OVERLAP = 23;    // feet overlap as in the photo
    const GREENS = [[33, 192], [394, 190]];   // pale green folder tabs behind: [x, width]
    const SHOW_GREENS = false;   // the green tabs behind are switched off
    const TILE = [742, 297];   // paper tile size on screen (css px) - keep in sync with .sheet
    // Tab side, traced from the photo, in tab heights: [out from the shoulder, down from the top].
    const SIDE = [[0,0],[.083,.031],[.188,.094],[.29,.198],[.396,.344],[.5,.51],[.583,.677],[.646,.781],[.729,.865],[.81,.927],[.958,1]];
    const SPAN = SIDE[SIDE.length - 1][0];
    const SVGNS = 'http://www.w3.org/2000/svg';

    // Smooth curve through points (Catmull-Rom as cubic Béziers).
    function smooth(pts) {
      let d = '';
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
      }
      return d;
    }
    function tabPath(w, h, ext) {
      const left = SIDE.map(([x, y]) => [SPAN * h - x * h, y * h]).reverse();   // foot -> shoulder
      const right = SIDE.map(([x, y]) => [w - SPAN * h + x * h, y * h]);         // shoulder -> foot
      return `M${left[0][0]},${left[0][1]}` + smooth(left) + ` L${right[0][0]},${right[0][1]}` + smooth(right) +
        ` L${w},${h + ext} L0,${h + ext} Z`;
    }
    function svgEl(w, h) {
      const svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'shape');
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      return svg;
    }
    // Paper pattern lined up with the sheet, so the front tab runs into it without a seam.
    const paper = (id, x, y, src = 'assets/folder/paper.jpg') =>
      `<pattern id="${id}" patternUnits="userSpaceOnUse" x="${x}" y="${y}" width="${TILE[0]}" height="${TILE[1]}">` +
      `<image href="${src}" width="${TILE[0]}" height="${TILE[1]}" preserveAspectRatio="none"/></pattern>`;

    // A folder tab cut (clip-path) out of the same CSS paper as the sheet and lined up with it
    // (x = the tab's left edge over the sheet), so it runs into the sheet without a seam.
    // .shape carries the shadow filters (a clip-path would cut them off); the front tab also gets a
    // plain strip of the same paper reaching into the sheet, without shadow, to cover the joint.
    function tabShape(w, h, i, x, active) {
      const paperCss = (shade, py) =>
        `background-image:${[...shade, 'url("assets/folder/paper.jpg")'].join(', ')}; ` +
        `background-position:${[...shade.map(() => '0 0'), `${-x}px ${py}px`].join(', ')}; ` +
        `background-size:${[...shade.map(() => '100% 100%'), `${TILE[0]}px ${TILE[1]}px`].join(', ')}`;
      const group = document.createElement('span');
      group.className = 'shape-group';
      const wrap = document.createElement('span');
      wrap.className = 'shape';
      const d = tabPath(w, h, 0);
      const p = document.createElement('span');
      p.className = 'shape-paper';
      // tabs behind the front one get a soft shading towards their foot
      const shade = active ? [] : ['linear-gradient(rgba(28, 36, 34, 0.04) 45%, rgba(28, 36, 34, 0.11))'];
      p.style.cssText = `width:${w}px; height:${h}px; -webkit-clip-path:path("${d}"); clip-path:path("${d}"); ${paperCss(shade, h)}`;
      wrap.appendChild(p);
      group.appendChild(wrap);
      if (active) {
        const ext = document.createElement('span');
        ext.className = 'shape-paper shape-ext';
        ext.style.cssText = `width:${w}px; height:7px; top:${h - 1}px; ${paperCss([], 1)}`;
        group.appendChild(ext);
      }
      return group;
    }
    function greenShape(w, h, i) {
      const r = h * 0.16, sl = h * 0.05, sr = h * 0.2;
      const d = `M0,${h} L${sl},${r} Q${sl},0 ${sl + r},0 L${w - sr - r},0 Q${w - sr},0 ${w - sr + r * 0.4},${r} L${w},${h} Z`;
      const svg = svgEl(w, h);
      svg.innerHTML = `<defs>${paper('pg' + i, 0, 0, 'assets/folder/paper-green.jpg')}</defs><path d="${d}" fill="url(#pg${i})" filter="url(#soft-edge)"/>`;
      return svg;
    }

    // Width of a tab label. Its computed width can come back as "auto" in Safari while the page is
    // re-laid out (e.g. on resize), which used to collapse every tab to nothing; fall back to its ratio.
    function labelWidth(svg, h) {
      const w = svg.getBoundingClientRect().width || parseFloat(getComputedStyle(svg).width);
      return w > 0 ? w : parseFloat(svg.style.getPropertyValue('--ratio')) * h;
    }
    function renderTabs(labels, active) {
      const side = sideTabs();
      folderEl.classList.toggle('side-tabs', side);
      // layout sizes, unaffected by the open animation's scale
      const u = side || phone.matches ? 40 / TAB_H : folderEl.offsetWidth / PHOTO_W;
      folderEl.style.setProperty('--u', u + 'px');
      const len = (side ? folderEl.offsetHeight : folderEl.offsetWidth) / u;   // in photo px
      if (side) folderEl.style.setProperty('--len', folderEl.offsetHeight + 'px');
      const n = labels.length;
      const order = side ? [...labels].reverse() : labels;   // rotated strip runs bottom -> top
      const span = SPAN * TAB_H;

      tabsEl.replaceChildren();
      const els = order.map((label) => {
        const b = document.createElement('button');
        b.className = 'tab' + (label === active ? ' active' : '');
        b.type = 'button';
        b.role = 'tab';
        b.setAttribute('aria-selected', label === active);
        b.setAttribute('aria-label', label);
        b.dataset.tab = label;
        b.appendChild(word(label));
        tabsEl.appendChild(b);
        return b;
      });
      // Natural width: label plus both sides; then spread across the folder like the photo.
      const need = els.map((b) => Math.max(labelWidth(b.lastChild, u * (side || phone.matches ? 27 : 20)) / u + 2 * span + 26, 140));
      const sum = need.reduce((a, b) => a + b, 0);
      let overlap = MIN_OVERLAP, widths = need;
      const spare = len - (sum - overlap * (n - 1));
      if (n === 1) widths = [Math.max(need[0], len * 0.36)];
      else if (side && spare > 0) widths = need;   // phones: each tab only as long as its label
      else if (spare > 0) widths = need.map((w) => w + spare / n);
      else overlap = Math.min(span + 6, MIN_OVERLAP - spare / (n - 1));
      const h = TAB_H * u;
      // phones: the one tab sits where it was in the stack; "back" goes on the other side
      const tx = phone.matches && n === 1 ? stackX[labels[0]] || 0 : 0;
      let x = 0;
      els.forEach((b, i) => {
        const w = Math.round(widths[i] * u);
        const isActive = b.classList.contains('active');
        b.style.width = w + 'px';
        b.style.marginRight = i < n - 1 ? -overlap * u + 'px' : '0';
        // left tabs lie over right ones (as in the photo); the active one is the front sheet
        b.style.zIndex = isActive ? 30 : side ? 10 + i : 10 + n - i;
        b.prepend(tabShape(w, h, i, side ? 0 : tx + x, isActive));
        x += w - overlap * u;
      });

      // Pale green tabs, only where tabs stand in front of them (as in the photo).
      const tabsEnd = x / u + overlap;
      tabsEl.style.paddingLeft = tx + 'px';
      // the opened folder keeps its paper clip
      if (phone.matches && n === 1 && stackClip[labels[0]]) tabsEl.appendChild(clipEl(stackClip[labels[0]]));
      toStack.classList.toggle('left', tx > folderEl.offsetWidth / 3);
      backTabs.replaceChildren(...(side || phone.matches || !SHOW_GREENS ? [] : GREENS.filter(([gx, gw]) => gx + gw <= tabsEnd).map(([gx, gw], i) => {
        const g = greenShape(Math.round(gw * u), Math.round(h), i);
        g.style.left = gx * u + 'px';
        return g;
      })));
    }

    // --- Phones: stack of folders ------------------------------------------------
    function renderStack() {
      const u = 40 / TAB_H, h = TAB_H * u, span = SPAN * TAB_H, n = tabs.length;
      stackEl.style.setProperty('--u', u + 'px');
      const W = stackEl.offsetWidth, H = stackEl.offsetHeight;
      // each folder sits a step lower than the one behind it; the pile sits low and runs
      // off the bottom of the screen, the front one showing the most
      const step = n > 1 ? Math.min(76, (H * 0.6 - h) / (n - 1)) : 0;
      const base = Math.max(0, H - (n - 1) * step - Math.max(H * 0.36, 200));
      // a few blank sheets inside each folder, peeking over its top edge (one per project, up to 3)
      const SHEETS = [[4, 46, 11, -1.2, '#f3f1ea'], [30, 52, 7, 0.9, '#e9e6dc'], [12, 60, 15, 0.4, '#f7f5ef']];   // [left %, width %, peek px, tilt, colour]
      const els = tabs.map((label, i) => {
        const f = document.createElement('button');
        f.type = 'button';
        f.className = 'sfolder';
        f.dataset.i = i;
        f.setAttribute('aria-label', label);
        const rot = i === n - 1 ? 0 : i % 2 ? 0.7 : -0.6;
        f.style.cssText = `top:${(base + i * step).toFixed(1)}px; --i:${i}; --rot:${rot}; z-index:${2 * i + 2}`;
        const count = Math.min(3, Math.max(1, projects.filter((p) => p.tab === label).length));
        SHEETS.slice(0, count).forEach(([x, w, peek, r, c], j) => {
          const s = document.createElement('span');
          s.className = 'sheet-peek';
          const flip = i % 2 ? -1 : 1;
          s.style.cssText = `left:${i % 2 ? 100 - x - w : x}%; width:${w}%; top:${(h - peek).toFixed(1)}px; rotate:${r * flip}deg; background:${c}`;
          f.appendChild(s);
        });
        const t = document.createElement('span');
        t.className = 'stab';
        t.appendChild(word(label));
        f.appendChild(t);
        return f;
      });
      stackEl.replaceChildren(...els);
      els.forEach((f, i) => {
        const t = f.lastChild;
        const need = Math.max(labelWidth(t.lastChild, u * 27) / u + 2 * span + 26, 140);
        const w = Math.round(Math.max(need, (W / u) * 0.36) * u);   // same width as the open folder's tab
        const x = n > 1 ? Math.round((i / (n - 1)) * (W - w)) : 0;
        stackX[tabs[i]] = x;
        t.style.left = x + 'px';
        t.style.width = w + 'px';
        // The whole folder (tab and body) is ONE piece cut (clip-path) from the CSS paper, so there's
        // no joint to show a seam. Its shadow is a small blurred copy of just the top edge, behind it
        // (a filter over the full folder makes iPhones lag and drop the drawing).
        const shadow = document.createElement('span');
        shadow.className = 'sshadow';
        const shadowShape = document.createElement('span');
        const top = folderPath(W, h + 18, x, w, h);
        shadowShape.style.cssText = `width:${W}px; height:${h + 18}px; -webkit-clip-path:path("${top}"); clip-path:path("${top}")`;
        shadow.appendChild(shadowShape);
        const paperEl = document.createElement('span');
        paperEl.className = 'spaper';
        const d = folderPath(W, H + 4, x, w, h);
        paperEl.style.cssText = `width:${W}px; height:${H + 4}px; background-position:0 ${h}px; -webkit-clip-path:path("${d}"); clip-path:path("${d}")`;
        f.insertBefore(shadow, t);
        f.insertBefore(paperEl, t);
        if (i % 2 === 0) {
          // in the widest bare stretch of the folder's edge beside its tab
          const leftFree = x, rightFree = W - x - w;
          const cx = rightFree > leftFree ? x + w + rightFree * 0.55 : leftFree * 0.4;
          const c = stackClip[tabs[i]] = { x: Math.round(cx), color: CLIP_COLORS[(i / 2) % 3], tilt: i % 4 ? 7 : -6 };
          f.appendChild(clipEl(c));
        }
      });
      return els;
    }
    // Outline of a whole folder: body W x H with its tab (x, w, h tall) on top; the body starts at y = h.
    function folderPath(W, H, x, w, h) {
      const left = SIDE.map(([px, py]) => [x + SPAN * h - px * h, py * h]).reverse();   // foot -> shoulder
      const right = SIDE.map(([px, py]) => [x + w - SPAN * h + px * h, py * h]);         // shoulder -> foot
      return `M0,${h} L${left[0][0]},${left[0][1]}` + smooth(left) + ` L${right[0][0]},${right[0][1]}` + smooth(right) +
        ` L${W},${h} L${W},${H} L0,${H} Z`;
    }
    // The address keeps where you are, so a refresh comes back to the same place:
    // #about, #work (the phone's folder stack), #work/<tab>, #work/<tab>/<item>
    const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    let shown = null;   // the project open in the detail view
    function syncHash() {
      let h = '';
      if (mode === 'about') h = '#about';
      else if (mode === 'work') {
        h = useStack() && overlay.classList.contains('stacked') ? '#work' : '#work/' + encodeURIComponent(activeTab);
        if (shown && !detail.hidden) h += '/' + slug(shown.title);
      }
      if (h !== location.hash) history.replaceState(null, '', h || location.pathname + location.search);
    }
    function showStack() {
      closeDetail();
      clearTimeout(stackTimer);
      folderEl.getAnimations().forEach((a) => a.cancel());
      overlay.classList.remove('stack-anim');
      overlay.classList.add('stacked');
      renderStack();
      syncHash();
    }
    const EASE = 'cubic-bezier(.24, 1, .29, 1)';
    const slot = (f) => `translateY(${f.offsetTop}px) rotate(${f.style.getPropertyValue('--rot')}deg)`;
    // Tap a folder: it slides out of the pile and opens; the others drop away.
    function openFromStack(i) {
      const els = [...stackEl.children], f = els[i];
      showWork(tabs[i]);
      overlay.classList.add('stack-anim');
      overlay.classList.remove('stacked');
      syncHash();
      f.style.visibility = 'hidden';
      els.forEach((g, j) => { if (j !== i) { g.style.setProperty('--d', Math.abs(j - i)); g.classList.add('away', j < i ? 'up' : 'down'); } });
      folderEl.style.zIndex = 1000;
      folderEl.classList.add('flip');
      // lifts a little off the pile, then rises and opens
      folderEl.animate([
        { transform: slot(f), easing: 'ease-out' },
        { transform: slot(f) + ' translateY(-14px)', offset: 0.22, easing: EASE },
        { transform: 'none' },
      ], { duration: 820 });
      clearTimeout(stackTimer);
      stackTimer = setTimeout(() => overlay.classList.remove('stack-anim'), 900);
    }
    // Back: the folder closes and slides back into its place in the pile.
    function backToStack() {
      const i = tabs.indexOf(activeTab);
      closeDetail();
      clearTimeout(stackTimer);
      board.classList.add('tucking');
      // a scrolled folder of papers rolls back to its top on the way, so its tab lands where the stack's is
      if (folderEl.scrollTop) folderEl.scrollTo({ top: 0, behavior: 'smooth' });
      overlay.classList.add('stack-anim');
      const els = renderStack(), f = els[i];
      f.style.visibility = 'hidden';
      els.forEach((g, j) => {
        g.style.animation = 'none';
        if (j !== i) { g.style.setProperty('--d', Math.abs(j - i)); g.classList.add('away', j < i ? 'up' : 'down'); }
      });
      stackEl.offsetWidth;   // start from "away", then let them come back
      requestAnimationFrame(() => els.forEach((g) => g.classList.remove('away', 'up', 'down')));
      folderEl.style.zIndex = 2 * i + 3;   // above the folders behind it, under the ones in front
      const a = folderEl.animate([{ transform: 'none' }, { transform: slot(f) }], { duration: 520, easing: EASE, fill: 'forwards' });
      a.finished.then(() => {
        if (mode !== 'work') return;
        overlay.classList.replace('stack-anim', 'stacked');
        f.style.visibility = '';
        syncHash();
        // its papers ease in, rather than popping up as the open folder hands over to it
        f.querySelectorAll('.sheet-peek').forEach((el) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease-out' }));
        a.cancel();
      }).catch(() => {});
    }

    // Press pieces (projects with "news") are drawn as a newspaper page: white paper, colour print.
    // Spans only, since it sits inside a button. Sizes are in cqw of .news, so it scales with the card.
    const paragraphs = (text) => String(text || '').split(/\n\s*\n/).filter(Boolean);
    // A folded broadsheet front page: ears and masthead (the outlet's logo) on top, the photo with
    // the story beside it, and a strip of other stories below (headlines of the other press pieces,
    // their text drawn as lines of print).
    // Items added in the press release folder without newspaper details still get a front page:
    // the outlet is guessed from the link's site.
    const NEWS_TAB = 'press release';
    const siteName = (u) => { try { return new URL(u).hostname.replace(/^www\./, '').split('.')[0]; } catch { return ''; } };
    const newsOf = (p) => p.news || (p.tab === NEWS_TAB
      ? { outlet: siteName(p.link?.href) || p.client || 'the press', kicker: 'music', date: p.year || '', byline: '', caption: '' } : null);
    function newsPage(p) {
      const n = newsOf(p);
      const same = projects.filter((o) => newsOf(o) && o.tab === p.tab);
      const i = same.indexOf(p);
      const others = [1, 2, 3].map((k) => same[(i + k) % same.length]).filter((o) => o && o !== p);
      return `<span class="news"><span class="news-in">
        <span class="news-top">
          <span class="news-ear">music &amp; culture<br>all the stories</span>
          ${n.logo ? `<span class="news-mast logo"><img src="${esc(n.logo)}" alt="${esc(n.outlet)}" draggable="false"></span>`
            : `<span class="news-mast">${esc(n.outlet)}</span>`}
          <span class="news-ear right">${esc(n.date)}</span>
        </span>
        <span class="news-main">
          <span class="news-photo"><img src="${esc(p.img)}" alt="" draggable="false"></span>
          <span class="news-lead">
            <span class="news-kicker">${esc(n.kicker)}</span>
            <span class="news-head${p.title.length > 70 ? ' long' : ''}">${esc(p.title)}</span>
            ${n.byline ? `<span class="news-by">by ${esc(n.byline)}</span>` : ''}
            <span class="news-body">${paragraphs(p.text).map((t) => `<span class="news-p">${esc(t)}</span>`).join('')}</span>
            <span class="news-lines"></span>
          </span>
        </span>
        <span class="news-cap">${esc(n.caption || '')}</span>
        <span class="news-more">${others.map((o, k) => `<span class="news-story"><span class="news-story-h">${esc(o.title)}</span><span class="news-lines"></span>` +
          (k === (i % 2) + 1 ? `<span class="news-thumb"><img src="${esc(o.img)}" alt="" draggable="false"></span>` : '') + '</span>').join('')}<span class="news-story"><span class="news-lines"></span></span></span>
      </span></span>`;
    }

    // A folder of newspapers scrolls as a whole: the tabs and the sheet's top edge go up with the
    // papers (the sheet is made as tall as its papers and the folder itself scrolls).
    const sheetEl = document.getElementById('sheet');
    let paperScroll = 0;
    function setScrolly(end, keepScroll) {
      const y = folderEl.scrollTop;
      folderEl.classList.remove('scrolly');
      sheetEl.style.height = '';
      if (end > 0) {
        const fill = sheetEl.clientHeight;   // as tall as the folder's normal sheet, at least
        folderEl.classList.add('scrolly');
        sheetEl.style.height = Math.max(end, fill) + 'px';
      }
      folderEl.scrollTop = keepScroll ? y : 0;
    }

    // Some folders have a look of their own: content seeding is a wall of torn notepad sheets
    // taped down, art is a wall of pasted-up posters (which can be ripped off).
    const BOARD_STYLE = { 'content seeding': 'notes', art: 'posters' };
    const handle = (title) => String(title).split(/\s+[-–]\s+/)[0];
    const shapeOf = (src) => new Promise((done) => {
      const im = new Image();
      im.onload = () => done(im.naturalWidth ? im.naturalHeight / im.naturalWidth : 1.25);
      im.onerror = () => done(1.25);
      im.src = src;
      setTimeout(() => done(1.25), 2500);
    });
    // a ragged line across [0..100] %, for torn paper edges: [[x, y], ...]
    function ragged(y, amp, seed) {
      let r = seed * 9301 + 49297;
      const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
      // a wandering line with small teeth, like paper torn by hand
      const pts = [];
      let drift = 0;
      for (let x = 0; x <= 100; x += 1.6) {
        drift = Math.max(-amp, Math.min(amp, drift + (rnd() - 0.5) * amp * 0.9));
        pts.push([x, y + drift + (rnd() - 0.5) * amp * 0.5]);
      }
      return pts;
    }
    const poly = (pts) => 'polygon(' + pts.map(([x, y]) => `${x.toFixed(1)}% ${y.toFixed(1)}%`).join(', ') + ')';

    // Content seeding: each post printed and taped onto a torn sheet from a lined notepad
    function renderNotes(tab, list) {
      const wrap = document.createElement('div');
      wrap.className = 'notes';
      const narrow = matchMedia('(max-width: 640px)').matches;
      const n = narrow ? 2 : Math.max(2, Math.min(5, Math.floor((board.clientWidth - 80) / 250)));
      const col = Array.from({ length: n }, () => wrap.appendChild(document.createElement('div')));
      const notes = list.map((p, i) => {
        const note = document.createElement('button');
        note.type = 'button';
        note.className = 'note';
        note.style.cssText = `--z:${i + 1}; --r:${[-2.2, 1.4, -0.8, 2, -1.6, 0.9][i % 6]}deg; --tape:${[-4, 3, -2, 5, -3][i % 5]}deg;` +
          `--edge:${poly([[0, 0], [100, 0], ...ragged(98.6, 1.1, i + 3).reverse()])}`;
        note.setAttribute('aria-label', p.title);
        const [who, what] = String(p.title).split(/\s+[-–]\s+/);
        note.innerHTML = `<span class="note-paper">
            <span class="note-head"><span>date</span><span>mo tu we th fr sa su</span><span>notes</span></span>
            <span class="note-hole"></span>
            <span class="note-pic"><img src="${esc(p.img)}" alt="" draggable="false" loading="lazy"></span>
            <span class="note-hand">${esc(what || p.title)}</span>
            <span class="note-hand small">${esc(who)}</span>
          </span><span class="note-tape"></span>`;
        note.addEventListener('click', () => openDetail(p));
        col[i % n].appendChild(note);
        return note;
      });
      board.replaceChildren(wrap);
      board.scrollTop = 0;
      const fit = (keep) => setScrolly(wrap.offsetHeight + 60, keep);
      fit(false);
      // a masonry: once the pictures' shapes are known, each note goes into the shortest column
      Promise.all(list.map((p) => shapeOf(p.img))).then((ratios) => {
        if (!wrap.isConnected) return;
        const h = new Array(n).fill(0);
        notes.forEach((note, i) => { const k = h.indexOf(Math.min(...h)); col[k].appendChild(note); h[k] += ratios[i] + 0.55; });
        fit(true);
      });
      wrap.querySelectorAll('img').forEach((im) => im.addEventListener('load', () => fit(true), { once: true }));
    }

    // Art: a wall in the city, posters pasted up over each other in a dense cluster, older ones
    // showing underneath. Grab one and pull: it tears off along a ragged line (a scrap stays on the
    // wall) and comes away with your hand. A tap without pulling opens it.
    function renderPosters(tab, list) {
      const narrow = matchMedia('(max-width: 640px)').matches;
      const wall = document.createElement('div');
      wall.className = 'wall';
      wall.innerHTML = `<div class="wall-in"></div><div class="wall-shade"></div>
        <p class="wall-hint"><span>${narrow ? 'tap to open · drag to rip' : 'click to open · drag to rip'}</span></p>
        <button type="button" class="wall-reset" hidden>paste them back</button>`;
      board.replaceChildren(wall);
      setScrolly(0);
      const inner = wall.querySelector('.wall-in'), reset = wall.querySelector('.wall-reset');
      // laid out once the wall has its size (it can still be zero while the folder opens)
      let ratios = null, laidW = 0;
      const ro = new ResizeObserver(() => {
        if (!wall.isConnected) return ro.disconnect();
        if (ratios && wall.clientHeight > 50 && Math.abs(wall.clientWidth - laidW) > 40) layout();
      });
      ro.observe(wall);
      Promise.all(list.map((p) => shapeOf(p.img))).then((r) => { ratios = r; if (wall.clientHeight > 50) layout(); });
      function layout() {
        if (!wall.isConnected || !list.length) return;
        laidW = wall.clientWidth;
        inner.replaceChildren();
        reset.hidden = true;
        let seed = 7;
        const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
        // on phones the folder runs below the screen: fit the cluster to the part you can see
        const W = wall.clientWidth, H = Math.min(wall.clientHeight, Math.max(300, innerHeight - 110 - (narrow ? 64 : 0)));
        // the posters cover the folder's sheet, side to side, with a ragged rim
        const cw = W * (narrow ? 0.9 : 0.86), ch = H * (narrow ? 0.8 : 0.8);
        const cols = narrow ? 3 : 6, cell = cw / cols, rows = Math.max(2, Math.round(ch / (cell * 1.25)));
        const rowH = ch / rows, x0 = (W - cw) / 2, y0 = (H - ch) / 2;
        const spots = [];
        // the older layer: one row-by-row paste-up, pictures in turn, only a little off-line; a corner or two left bare
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const corner = (r === 0 || r === rows - 1) && (c === 0 || c === cols - 1);
          if (corner && rnd() < 0.5) continue;
          spots.push({
            cx: x0 + (c + 0.5 + (r % 2 ? 0.12 : -0.12)) * cell + (rnd() - 0.5) * cell * 0.12,
            cy: y0 + (r + 0.5) * rowH + (rnd() - 0.5) * rowH * 0.12,
            w: cell * (1.02 + rnd() * 0.1), layer: 0, i: (r * cols + c + r) % list.length,
          });
        }
        // the top layer: each piece once, a bit bigger, in a loose grid over the middle
        const tc = Math.min(list.length, narrow ? 2 : 3), tr = Math.ceil(list.length / tc);
        list.forEach((p, i) => {
          const r = Math.floor(i / tc), inRow = r === tr - 1 ? list.length - r * tc : tc, c = i - r * tc;
          spots.push({
            cx: W / 2 + (c - (inRow - 1) / 2) * cw * (narrow ? 0.42 : 0.27) + (rnd() - 0.5) * cell * 0.15,
            cy: H / 2 + (r - (tr - 1) / 2) * ch * (narrow ? 0.34 : 0.42) + (rnd() - 0.5) * cell * 0.15,
            w: cell * (narrow ? 1.25 : 1.4), layer: 2, i,
          });
        });
        spots.forEach((sp, k) => {
          const p = list[sp.i], ratio = ratios[sp.i];
          const h = sp.w * ratio;
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'poster' + (rnd() < 0.12 && sp.layer < 2 ? ' tissue' : '');
          el.setAttribute('aria-label', p.title);
          const torn = rnd() < 0.3 ? ragged(rnd() < 0.5 ? 96 : 4, 1.6, k + 5) : null;
          el.style.cssText = `left:${sp.cx - sp.w / 2}px; top:${sp.cy - h / 2}px; width:${sp.w}px; height:${h}px;` +
            `--r:${((rnd() - 0.5) * (sp.layer === 2 ? 4 : 3.5)).toFixed(2)}deg; z-index:${sp.layer * 100 + Math.floor(rnd() * 90)};` +
            `--shade:${sp.layer === 2 ? 1 : 0.9}; --z:${k};` +
            (torn ? `clip-path:${poly(torn[0][1] > 50 ? [[0, 0], [100, 0], ...torn.slice().reverse()] : [...torn, [100, 100], [0, 100]])};` : '');
          el.innerHTML = `<span class="poster-paper"><img src="${esc(p.img)}" alt="" draggable="false"></span>`;
          el.project = p;
          inner.appendChild(el);
          ripHandlers(el, k, reset);
        });
      }
      reset.addEventListener('click', () => {
        inner.querySelectorAll('.poster.ripped').forEach((el) => {
          el.classList.remove('ripped');
          el.style.clipPath = el.dataset.clip || '';
          el.animate([{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'ease-out' });
        });
        reset.hidden = true;
      });
    }
    function ripHandlers(el, k, reset) {
      let sx = 0, sy = 0, down = false, piece = null, pid = 0, grabY = 0, dirDown = true;
      el.addEventListener('pointerdown', (e) => {
        if (el.classList.contains('ripped')) return;
        down = true; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
        const r = el.getBoundingClientRect();
        grabY = ((e.clientY - r.top) / r.height) * 100;
        e.preventDefault();
        try { el.setPointerCapture(pid); } catch {}
      });
      el.addEventListener('pointermove', (e) => {
        if (!down) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!piece) {
          if (Math.hypot(dx, dy) < 10) return;
          dirDown = dy >= -Math.abs(dx) * 0.3;
          piece = startRip(el, k, grabY, dirDown);
          reset.hidden = false;
        }
        // the torn piece hangs from your hand: it follows, swings and curls away from the wall
        const pull = Math.min(1, Math.hypot(dx, dy) / 260);
        piece.style.transform = `translate(${dx}px, ${dy}px) perspective(900px) rotateX(${(dirDown ? -1 : 1) * pull * 28}deg) rotate(${dx * 0.05}deg) scale(${1 + pull * 0.04})`;
      });
      const end = (e) => {
        if (!down) return;
        down = false;
        if (!piece) return;
        const p = piece; piece = null;
        const dx = e.clientX - sx, dy = e.clientY - sy, side = Math.sign(dx || 1);
        p.animate([
          { transform: p.style.transform },
          { transform: `translate(${dx * 1.6 + side * 120}px, ${Math.max(dy, 0) + innerHeight}px) perspective(900px) rotateX(-40deg) rotate(${side * 50}deg)` },
        ], { duration: 900, easing: 'cubic-bezier(.45, 0, .9, .55)', fill: 'forwards' }).finished.then(() => p.remove(), () => p.remove());
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('click', (e) => {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10 || el.classList.contains('ripped')) return;
        openDetail(el.project);
      });
    }
    // Split a poster along a ragged line near where it was grabbed: the far side stays pasted up,
    // the side you hold becomes a loose piece.
    function startRip(el, k, grabY, dirDown) {
      const y = Math.max(8, Math.min(92, grabY + (dirDown ? -14 : 14)));
      const edge = ragged(y, 2.4, k + 31);
      const keep = dirDown ? [[0, 0], [100, 0], ...edge.slice().reverse()] : [...edge, [100, 100], [0, 100]];
      const gone = dirDown ? [...edge, [100, 100], [0, 100]] : [[0, 0], [100, 0], ...edge.slice().reverse()];
      const r = el.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
      const piece = el.cloneNode(true);
      piece.classList.add('rip-piece');
      piece.style.cssText += `; position: fixed; left: ${r.left + (r.width - w) / 2}px; top: ${r.top + (r.height - h) / 2}px; width: ${w}px; height: ${h}px;` +
        `z-index: 3000; clip-path: ${poly(gone)}; transform-origin: 50% ${dirDown ? y : y}%;`;
      document.body.appendChild(piece);
      el.dataset.clip = el.style.clipPath || '';
      el.style.clipPath = poly(keep);
      el.classList.add('ripped');
      return piece;
    }

    function renderBoard(tab) {
      const narrow = matchMedia('(max-width: 640px)').matches;
      board.classList.remove('tucking');
      setScrolly(0);
      // phones: the cards run down the sheet (it scrolls when there are many)
      const H = sheetEl.clientHeight || innerHeight * 0.8, step = H * 0.26;
      const list = projects.filter((p) => p.tab === tab);
      const style = BOARD_STYLE[tab];
      board.classList.toggle('styled', !!style);
      if (style) { board.classList.remove('papers'); return style === 'notes' ? renderNotes(tab, list) : renderPosters(tab, list); }
      // newspapers are laid out down the folder, overlapping a little, and the folder scrolls:
      // two staggered columns on desktop, one column on phones
      const papers = list.length > 0 && list.every((p) => newsOf(p));
      if (papers) list.reverse();   // the newest piece first
      const BW = board.clientWidth || innerWidth;
      const pw = narrow ? 74 : 37, ph = (BW * pw) / 100 / 1.32;
      const paperAt = (i) => narrow
        ? { x: 13 + (i % 2 ? 1.5 : -1.5), top: 24 + i * ph * 0.82 }
        : { x: i % 2 ? 51 : 12, top: 36 + Math.floor(i / 2) * ph * 0.96 + (i % 2) * ph * 0.48 };
      board.classList.toggle('papers', papers);
      const cards = list.map((p, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card' + (newsOf(p) ? ' news-card' : '');
        const at = papers && paperAt(i);
        const pos = papers ? { x: at.x, y: 0, w: pw } : !narrow ? p : { x: i % 2 ? 28 : 5, y: 0, w: 66 };
        const top = papers ? at.top : H * 0.05 + i * step;
        const r = papers ? [-1.2, 0.8, -0.4, 1.3, -0.9, 0.5][i % 6] : p.r;
        card.style.cssText = `--x:${pos.x}; --y:${pos.y}; --w:${pos.w}; --r:${r}; --z:${i + 1}` +
          (narrow || papers ? `; top:${Math.round(top)}px` : '');
        card.setAttribute('aria-label', p.title);
        card.innerHTML = newsOf(p)
          ? `${newsPage(p)}<span class="caption">${esc(newsOf(p).outlet)}</span>`
          : `<img src="${esc(p.img)}" alt="" draggable="false"><span class="caption">${esc(p.title)}</span>`;
        card.project = p;
        makeDraggable(card);
        return card;
      });
      if (list.length && (narrow || papers)) {
        // room below the last card, so it can be scrolled fully into view
        const end = document.createElement('span');
        end.className = 'board-end';
        end.style.top = Math.round(papers ? paperAt(list.length - 1).top + ph
          : H * 0.05 + (list.length - 1) * step + board.clientWidth * 0.66 * 1.4 + 40) + 'px';
        cards.push(end);
      }
      board.replaceChildren(...cards);
      board.scrollTop = 0;
      if (papers) setScrolly(paperAt(list.length - 1).top + ph + 60);
    }

    function showWork(tab = activeTab) {
      activeTab = tab;
      renderTabs(useStack() ? [tab] : tabs, tab);   // phones: an opened folder shows just its own tab
      renderBoard(tab);
      toStack.hidden = !useStack();
      closeDetail();
      board.hidden = false;
      aboutEl.hidden = true;
      syncHash();
    }
    function showAbout() {
      renderTabs(['about'], 'about');
      toStack.hidden = true;
      closeDetail();
      board.hidden = true;
      aboutEl.hidden = false;
      syncHash();
    }

    function open(which, tab) {
      if (mode === which) return close();
      clearTimeout(closeTimer);
      mode = which;
      overlay.classList.remove('stacked', 'stack-anim');
      folderEl.classList.remove('flip');
      folderEl.style.zIndex = '';
      if (which === 'about') showAbout();
      else if (useStack() && !tab) showStack();
      else showWork(tab);
      overlay.classList.remove('closing');
      overlay.classList.add('open');
      document.body.classList.add('folder-open');
      overlay.setAttribute('aria-hidden', 'false');
    }
    function close() {
      if (!mode) return;
      mode = null;
      board.classList.add('tucking');
      overlay.classList.remove('open');
      overlay.classList.add('closing');
      document.body.classList.remove('folder-open');
      overlay.setAttribute('aria-hidden', 'true');
      closeTimer = setTimeout(() => overlay.classList.remove('closing'), 450);
      syncHash();
    }

    // --- Project detail ------------------------------------------------------
    function openDetail(p) {
      // the main picture (or the newspaper page), then any more pictures as a little gallery
      const pics = [p.img, ...(Array.isArray(p.images) ? p.images : [])].filter(Boolean);
      const first = newsOf(p) ? newsPage(p) : `<img src="${esc(p.img)}" alt="${esc(p.title)}">`;
      const many = pics.length > 1;
      detail.innerHTML = `
        <button class="back" type="button" aria-label="back"></button>
        <div class="detail-media">
          <div class="stage">${first}${many ? `<button type="button" class="nav-prev" aria-label="previous picture">‹</button><button type="button" class="nav-next" aria-label="next picture">›</button>` : ''}</div>
          ${many ? `<div class="thumbs">${pics.map((src, i) => `<button type="button" class="thumb${i ? '' : ' on'}" data-i="${i}" aria-label="picture ${i + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
        </div>
        <div class="detail-info">
          <p class="meta">${esc(p.tab)} · ${esc(p.client)} · ${esc(p.year)}</p>
          <h2>${esc(p.title)}</h2>
          ${paragraphs(p.text).map((t) => `<p>${esc(t)}</p>`).join('')}
          ${p.link?.href ? `<a class="detail-link" href="${esc(p.link.href)}" target="_blank" rel="noopener">${esc(p.link.label || 'link')} ↗</a>` : ''}
        </div>`;
      detail.querySelector('.back').appendChild(word('back'));
      if (many) {
        const stage = detail.querySelector('.stage');
        let at = 0;
        const show = (i) => {
          at = (i + pics.length) % pics.length;
          stage.querySelector('.news, :scope > img')?.remove();
          stage.insertAdjacentHTML('afterbegin', at === 0 ? first : `<img src="${esc(pics[at])}" alt="${esc(p.title)}">`);
          stage.firstElementChild.animate([{ opacity: 0 }, { opacity: 1 }], 250);
          detail.querySelectorAll('.thumb').forEach((t) => t.classList.toggle('on', +t.dataset.i === at));
        };
        detail.querySelector('.thumbs').addEventListener('click', (e) => { const t = e.target.closest('.thumb'); if (t) show(+t.dataset.i); });
        detail.querySelector('.nav-prev').addEventListener('click', () => show(at - 1));
        detail.querySelector('.nav-next').addEventListener('click', () => show(at + 1));
        // phones: swipe the picture sideways
        let tx = null;
        stage.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
        stage.addEventListener('touchend', (e) => {
          if (tx === null) return;
          const d = e.changedTouches[0].clientX - tx; tx = null;
          if (Math.abs(d) > 40) show(at + (d < 0 ? 1 : -1));
        });
      }
      // the detail fills the folder as usual: leave the scrolling layout while it is open
      if (folderEl.classList.contains('scrolly')) {
        paperScroll = folderEl.scrollTop;
        folderEl.classList.remove('scrolly');
        folderEl.dataset.paperH = sheetEl.style.height;
        sheetEl.style.height = '';
      }
      detail.hidden = false;
      board.classList.add('dimmed');
      requestAnimationFrame(() => detail.classList.add('in'));
      setTimeout(() => { if (!detail.hidden) detail.classList.add('in'); }, 80);   // in case a frame is late
      shown = p;
      syncHash();
    }
    function closeDetail() {
      detail.classList.remove('in');
      detail.hidden = true;
      board.classList.remove('dimmed');
      if (folderEl.dataset.paperH) {
        folderEl.classList.add('scrolly');
        sheetEl.style.height = folderEl.dataset.paperH;
        delete folderEl.dataset.paperH;
        folderEl.scrollTop = paperScroll;
      }
      shown = null;
      if (mode) syncHash();
    }

    // --- Clicks ---------------------------------------------------------------
    document.addEventListener('click', (e) => {
      const opener = e.target.closest('[data-open]');
      if (opener) { e.preventDefault(); open(opener.dataset.open); return; }
      if (!mode) return;
      const sf = e.target.closest('.sfolder');
      if (sf) { openFromStack(+sf.dataset.i); return; }
      if (e.target.closest('.to-stack')) { backToStack(); return; }
      const tab = e.target.closest('.tab');
      if (tab && mode === 'work') { useStack() ? backToStack() : showWork(tab.dataset.tab); return; }
      if (e.target.closest('.back')) { closeDetail(); return; }
      // Click outside the folder closes it (header links still work).
      // (a pull on the poster wall can end anywhere)
      if (e.target.closest('.wall')) return;
      if (!e.target.closest('#folder') && !e.target.closest('.nav')) close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!detail.hidden) closeDetail();
      else if (mode === 'work' && useStack() && !overlay.classList.contains('stacked')) backToStack();
      else close();
    });
    let resizeTimer, lastW = innerWidth;
    addEventListener('resize', () => {
      // on phones the toolbars slide in and out while scrolling, which only changes the height:
      // re-laying out then closed whatever was open, so only a change of width counts
      if (innerWidth === lastW) return;
      lastW = innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const keep = !detail.hidden && shown;
        if (mode === 'work' && useStack() && overlay.classList.contains('stacked')) showStack();
        else if (mode === 'work') { overlay.classList.remove('stacked', 'stack-anim'); showWork(activeTab); if (keep) openDetail(keep); }
        else if (mode === 'about') showAbout();
      }, 150);
    });
    // #work opens the folder; #work/<tab> opens it on that tab (e.g. #work/art)
    // and #work/<tab>/<item> opens that item
    if (location.hash.startsWith('#work')) {
      const [t, item] = location.hash.slice(6).split('/').map(decodeURIComponent);
      open('work', tabs.includes(t) ? t : undefined);
      const p = item && projects.find((o) => o.tab === t && slug(o.title) === item);
      if (p) openDetail(p);
    }
    if (location.hash === '#about') open('about');

    // --- Drag cards; a click without dragging opens the project --------------
    let front = 100;
    // Mouse: drag right away. Touch: a swipe scrolls the folder; press and hold to pick a card up.
    function makeDraggable(card) {
      let startX, startY, dx = 0, dy = 0, baseX = 0, baseY = 0, moved = false, down = false, held = false, timer = 0;
      let pid = 0;
      const lift = () => {
        held = true; moved = true;
        try { card.setPointerCapture(pid); } catch {}
        card.style.zIndex = ++front;
        card.classList.add('dragging');
        navigator.vibrate?.(8);
      };
      card.addEventListener('pointerdown', (e) => {
        down = true; moved = false; held = false; dx = dy = 0;
        startX = e.clientX; startY = e.clientY;
        pid = e.pointerId;
        if (e.pointerType === 'mouse') {
          e.preventDefault();
          held = true;
          card.style.zIndex = ++front;
          try { card.setPointerCapture(pid); } catch {}
        } else {
          clearTimeout(timer);
          timer = setTimeout(() => { if (down) lift(); }, 320);
        }
      });
      card.addEventListener('pointermove', (e) => {
        if (!down) return;
        const mx = e.clientX - startX, my = e.clientY - startY;
        if (!held) {
          // moved before the hold: it's a scroll, not a drag
          if (Math.abs(mx) + Math.abs(my) > 8) { clearTimeout(timer); down = false; }
          return;
        }
        dx = mx; dy = my;
        if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; card.classList.add('dragging'); }
        card.style.translate = `${baseX + dx}px ${baseY + dy}px`;
      });
      // once a card is held, the finger moves it instead of scrolling the page
      card.addEventListener('touchmove', (e) => { if (held && down) e.preventDefault(); }, { passive: false });
      card.addEventListener('contextmenu', (e) => e.preventDefault());
      const end = () => {
        clearTimeout(timer);
        if (!down) return;
        down = false;
        held = false;
        card.classList.remove('dragging');
        baseX += dx; baseY += dy; dx = dy = 0;
      };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
      card.addEventListener('click', () => {
        if (!moved) openDetail(card.project);
        moved = false;
      });
    }
  </script>
</body>
</html>
