<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rocket effect marketing</title>
  <meta name="description" content="rocket effect marketing — press release, digital ads, content seeding, art, pr.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
  <header class="nav">
    <a class="left" href="./" data-word>rocket effect marketing</a>
    <!-- On phones the links fold into a drop-down opened by the rocket button. -->
    <div class="links" id="nav-links">
      <a class="center" href="#work" data-open="work" data-word>work</a>
      <nav class="right">
        <a href="#about" data-open="about" data-word>about</a>
        <a href="mailto:info@wavefoundation.co" id="email-link" data-word>email</a>
        <a href="https://www.instagram.com/rocket.effect" id="ig-link" target="_blank" rel="noopener" data-word>ig</a>
      </nav>
    </div>
    <button class="menu-btn" id="menu-btn" type="button" aria-label="menu" aria-expanded="false" aria-controls="nav-links">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g class="rocket">
          <g transform="rotate(45 20 20)">
            <path class="flame" d="M16.6 28.5 C16.6 32 18.2 35 20 37.5 C21.8 35 23.4 32 23.4 28.5 Z"/>
            <path class="fin" d="M14.3 20.5 L10.2 25.6 L10.6 29.6 L15 27.4 Z M25.7 20.5 L29.8 25.6 L29.4 29.6 L25 27.4 Z"/>
            <path class="body" d="M20 3 C25 7 26.6 13 26.4 19.5 L25.6 28.6 H14.4 L13.6 19.5 C13.4 13 15 7 20 3 Z"/>
            <circle class="window" cx="20" cy="15.2" r="2.9"/>
          </g>
        </g>
        <g class="smoke"><circle cx="11" cy="29" r="2.6"/><circle cx="7.5" cy="32" r="2"/><circle cx="12.5" cy="33.6" r="1.6"/></g>
      </svg>
    </button>
  </header>

  <!-- Hero: the words sit spread over the page and switch on/off one by one. -->
  <main class="hero" id="hero">
    <h1 class="sr-only">rocket effect marketing</h1>
    <a class="hero-word w1" href="#work" data-open="work" aria-label="rocket"></a>
    <a class="hero-word w2" href="#work" data-open="work" aria-label="effect"></a>
  </main>

  <!-- Folder overlay: used for work (tabs per category) and about. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- softens cut edges by a hair, like a paper edge -->
    <filter id="soft-edge" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.55" result="a"/>
      <feComposite in="SourceGraphic" in2="a" operator="in"/>
    </filter>
  </svg>
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="folder" id="folder">
      <div class="back-tabs" id="back-tabs"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="sheet" id="sheet">
        <div class="board" id="board"></div>
        <article class="detail" id="detail" hidden></article>
        <div class="about-copy" id="about" hidden></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { buildWordSVG, loadFont } from './assets/blobfont.js';
    import { animateLetters } from './assets/hero-anim.js';

    // All content (texts, tabs, projects) lives in content.json, edited from /admin.
    // ?preview shows the unsaved draft from the admin panel (this browser only).
    let content;
    if (new URLSearchParams(location.search).has('preview')) {
      try { content = JSON.parse(localStorage.getItem('re-admin-draft')); } catch {}
    }
    const fontReady = loadFont();
    content ||= await fetch('content.json', { cache: 'no-cache' }).then((r) => r.json());
    await fontReady;
    const { site = {}, hero = [], heroLayout = {}, heroAnim = {}, tabs = [], projects = [], about = [] } = content;
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    if (site.title) document.title = site.title;
    if (site.description) document.querySelector('meta[name=description]').content = site.description;
    if (site.email) document.getElementById('email-link').href = 'mailto:' + site.email;
    if (site.instagram) document.getElementById('ig-link').href = site.instagram;
    document.querySelectorAll('.hero-word').forEach((a, i) => {
      if (hero[i]) a.setAttribute('aria-label', hero[i]); else a.remove();
    });

    const word = (text) => buildWordSVG(text, { line: true });

    // Header links drawn in the site lettering (text kept as aria-label).
    document.querySelectorAll('[data-word]').forEach((a) => {
      const label = a.textContent.trim();
      a.setAttribute('aria-label', label);
      a.replaceChildren(word(label));
    });

    // --- Phone menu: the rocket button opens the links as a drop-down ------------
    const nav = document.querySelector('.nav');
    const menuBtn = document.getElementById('menu-btn');
    const setMenu = (open) => {
      if (open === nav.classList.contains('menu-open')) return;
      nav.classList.toggle('menu-open', open);
      menuBtn.setAttribute('aria-expanded', open);
      // replay the take-off / landing animation
      menuBtn.classList.remove('launch', 'land');
      void menuBtn.offsetWidth;
      menuBtn.classList.add(open ? 'launch' : 'land');
    };
    menuBtn.addEventListener('click', () => setMenu(!nav.classList.contains('menu-open')));
    document.addEventListener('click', (e) => {
      if (e.target.closest('#nav-links a') || !e.target.closest('.nav')) setMenu(false);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
    document.querySelectorAll('#nav-links a').forEach((a, i) => a.style.setProperty('--i', i));

    // --- Hero: letters fade on one by one, then off one by one ---------------
    const heroWords = [...document.querySelectorAll('.hero-word')];
    heroWords.forEach((a) => a.appendChild(buildWordSVG(a.getAttribute('aria-label'), { line: true, letters: true })));
    const letters = heroWords.flatMap((w) => [...w.querySelectorAll('.ch')]);
    // Word positions from the admin panel: x, y in % of the screen, w = word width in % of screen width.
    const phoneHero = matchMedia('(max-width: 640px)');
    function placeHero() {
      const layout = heroLayout[phoneHero.matches ? 'phone' : 'desktop'] || [];
      heroWords.forEach((a, i) => {
        const l = layout[i];
        a.style.cssText = l ? `left:${l.x}vw; top:${l.y}vh; right:auto` : '';
        a.firstChild.style.width = l ? l.w + 'vw' : '';
        a.firstChild.style.height = l ? 'auto' : '';
      });
    }
    placeHero();
    phoneHero.addEventListener('change', placeHero);
    animateLetters(letters, heroAnim, heroWords);

    // --- Folder overlay ------------------------------------------------------
    const overlay = document.getElementById('overlay');
    const tabsEl = document.getElementById('tabs');
    const folderEl = document.getElementById('folder');
    const backTabs = document.getElementById('back-tabs');
    const board = document.getElementById('board');
    const detail = document.getElementById('detail');
    const aboutEl = document.getElementById('about');
    let mode = null;          // 'work' | 'about' | null
    let activeTab = tabs[0];
    let closeTimer;

    aboutEl.innerHTML = about.map((p) => `<p>${esc(p)}</p>`).join('');

    // Phones: tabs stacked down the left side of the folder.
    // Set to false to go back to tabs along the top on phones too.
    const SIDE_TABS_ON_PHONE = true;
    const phone = matchMedia('(max-width: 640px)');
    const sideTabs = () => SIDE_TABS_ON_PHONE && phone.matches;

    // Folder tabs: clean outlines traced from the reference photo, filled with
    // the photo's own paper (assets/folder/paper.jpg, a seamless tile), no strokes.
    // Sizes are in photo pixels; --u is one photo pixel on screen.
    const PHOTO_W = 670;
    const TAB_H = 51;          // tab top to the folder body
    const MIN_OVERLAP = 23;    // feet overlap as in the photo
    const GREENS = [[33, 192], [394, 190]];   // pale green folder tabs behind: [x, width]
    const TILE = [742, 297];   // paper tile size on screen (css px) - keep in sync with .sheet
    // Tab side, traced from the photo, in tab heights: [out from the shoulder, down from the top].
    const SIDE = [[0,0],[.083,.031],[.188,.094],[.29,.198],[.396,.344],[.5,.51],[.583,.677],[.646,.781],[.729,.865],[.81,.927],[.958,1]];
    const SPAN = SIDE[SIDE.length - 1][0];
    const SVGNS = 'http://www.w3.org/2000/svg';

    // Smooth curve through points (Catmull-Rom as cubic Béziers).
    function smooth(pts) {
      let d = '';
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
      }
      return d;
    }
    function tabPath(w, h, ext) {
      const left = SIDE.map(([x, y]) => [SPAN * h - x * h, y * h]).reverse();   // foot -> shoulder
      const right = SIDE.map(([x, y]) => [w - SPAN * h + x * h, y * h]);         // shoulder -> foot
      return `M${left[0][0]},${left[0][1]}` + smooth(left) + ` L${right[0][0]},${right[0][1]}` + smooth(right) +
        ` L${w},${h + ext} L0,${h + ext} Z`;
    }
    function svgEl(w, h) {
      const svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'shape');
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      return svg;
    }
    // Paper pattern lined up with the sheet, so the front tab runs into it without a seam.
    const paper = (id, x, y, src = 'assets/folder/paper.jpg') =>
      `<pattern id="${id}" patternUnits="userSpaceOnUse" x="${x}" y="${y}" width="${TILE[0]}" height="${TILE[1]}">` +
      `<image href="${src}" width="${TILE[0]}" height="${TILE[1]}" preserveAspectRatio="none"/></pattern>`;

    function tabShape(w, h, i, x, active) {
      const ext = active ? 6 : 0;   // the front tab reaches a little into the sheet (same paper, no seam)
      const svg = svgEl(w, h + ext);
      const d = tabPath(w, h, ext);
      svg.innerHTML = `<defs>${paper('pt' + i, -x, h)}` +
        `<linearGradient id="sh${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#1c2422" stop-opacity="0.04"/>` +
        `<stop offset="1" stop-color="#1c2422" stop-opacity="0.11"/></linearGradient></defs>` +
        `<g filter="url(#soft-edge)"><path d="${d}" fill="url(#pt${i})"/>` +
        (active ? '' : `<path d="${d}" fill="url(#sh${i})"/>`) + '</g>';
      return svg;
    }
    function greenShape(w, h, i) {
      const r = h * 0.16, sl = h * 0.05, sr = h * 0.2;
      const d = `M0,${h} L${sl},${r} Q${sl},0 ${sl + r},0 L${w - sr - r},0 Q${w - sr},0 ${w - sr + r * 0.4},${r} L${w},${h} Z`;
      const svg = svgEl(w, h);
      svg.innerHTML = `<defs>${paper('pg' + i, 0, 0, 'assets/folder/paper-green.jpg')}</defs><path d="${d}" fill="url(#pg${i})" filter="url(#soft-edge)"/>`;
      return svg;
    }

    function renderTabs(labels, active) {
      const side = sideTabs();
      folderEl.classList.toggle('side-tabs', side);
      // layout sizes, unaffected by the open animation's scale
      const u = side ? 40 / TAB_H : folderEl.offsetWidth / PHOTO_W;
      folderEl.style.setProperty('--u', u + 'px');
      const len = (side ? folderEl.offsetHeight : folderEl.offsetWidth) / u;   // in photo px
      if (side) folderEl.style.setProperty('--len', folderEl.offsetHeight + 'px');
      const n = labels.length;
      const order = side ? [...labels].reverse() : labels;   // rotated strip runs bottom -> top
      const span = SPAN * TAB_H;

      tabsEl.replaceChildren();
      const els = order.map((label) => {
        const b = document.createElement('button');
        b.className = 'tab' + (label === active ? ' active' : '');
        b.type = 'button';
        b.role = 'tab';
        b.setAttribute('aria-selected', label === active);
        b.setAttribute('aria-label', label);
        b.dataset.tab = label;
        b.appendChild(word(label));
        tabsEl.appendChild(b);
        return b;
      });
      // Natural width: label plus both sides; then spread across the folder like the photo.
      const need = els.map((b) => Math.max(parseFloat(getComputedStyle(b.lastChild).width) / u + 2 * span + 26, 140));
      const sum = need.reduce((a, b) => a + b, 0);
      let overlap = MIN_OVERLAP, widths = need;
      const spare = len - (sum - overlap * (n - 1));
      if (n === 1) widths = [Math.max(need[0], len * 0.36)];
      else if (spare > 0) widths = need.map((w) => w + spare / n);
      else overlap = Math.min(span + 6, MIN_OVERLAP - spare / (n - 1));
      const h = TAB_H * u;
      let x = 0;
      els.forEach((b, i) => {
        const w = Math.round(widths[i] * u);
        const isActive = b.classList.contains('active');
        b.style.width = w + 'px';
        b.style.marginRight = i < n - 1 ? -overlap * u + 'px' : '0';
        // left tabs lie over right ones (as in the photo); the active one is the front sheet
        b.style.zIndex = isActive ? 30 : side ? 10 + i : 10 + n - i;
        b.prepend(tabShape(w, h, i, side ? 0 : x, isActive));
        x += w - overlap * u;
      });

      // Pale green tabs, only where tabs stand in front of them (as in the photo).
      const tabsEnd = x / u + overlap;
      backTabs.replaceChildren(...(side ? [] : GREENS.filter(([gx, gw]) => gx + gw <= tabsEnd).map(([gx, gw], i) => {
        const g = greenShape(Math.round(gw * u), Math.round(h), i);
        g.style.left = gx * u + 'px';
        return g;
      })));
    }

    function renderBoard(tab) {
      const narrow = matchMedia('(max-width: 640px)').matches;
      board.replaceChildren(...projects.filter((p) => p.tab === tab).map((p, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        // On phones keep the freeform pile, just bigger cards stacked down the sheet.
        const pos = narrow ? { x: i % 2 ? 28 : 5, y: 5 + i * 26, w: 66 } : p;
        card.style.cssText = `--x:${pos.x}; --y:${pos.y}; --w:${pos.w}; --r:${p.r}; --z:${i + 1}`;
        card.setAttribute('aria-label', p.title);
        card.innerHTML = `<img src="${esc(p.img)}" alt="" draggable="false"><span class="caption">${esc(p.title)}</span>`;
        card.project = p;
        makeDraggable(card);
        return card;
      }));
    }

    function showWork(tab = activeTab) {
      activeTab = tab;
      renderTabs(tabs, tab);
      renderBoard(tab);
      closeDetail();
      board.hidden = false;
      aboutEl.hidden = true;
    }
    function showAbout() {
      renderTabs(['about'], 'about');
      closeDetail();
      board.hidden = true;
      aboutEl.hidden = false;
    }

    function open(which) {
      if (mode === which) return close();
      clearTimeout(closeTimer);
      mode = which;
      which === 'about' ? showAbout() : showWork();
      overlay.classList.remove('closing');
      overlay.classList.add('open');
      document.body.classList.add('folder-open');
      overlay.setAttribute('aria-hidden', 'false');
    }
    function close() {
      if (!mode) return;
      mode = null;
      overlay.classList.remove('open');
      overlay.classList.add('closing');
      document.body.classList.remove('folder-open');
      overlay.setAttribute('aria-hidden', 'true');
      closeTimer = setTimeout(() => overlay.classList.remove('closing'), 450);
    }

    // --- Project detail ------------------------------------------------------
    function openDetail(p) {
      detail.innerHTML = `
        <button class="back" type="button" aria-label="back"></button>
        <div class="detail-media"><img src="${esc(p.img)}" alt="${esc(p.title)}"></div>
        <div class="detail-info">
          <p class="meta">${esc(p.tab)} · ${esc(p.client)} · ${esc(p.year)}</p>
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.text)}</p>
          ${p.link?.href ? `<a class="detail-link" href="${esc(p.link.href)}" target="_blank" rel="noopener">${esc(p.link.label || 'link')} ↗</a>` : ''}
        </div>`;
      detail.querySelector('.back').appendChild(word('back'));
      detail.hidden = false;
      board.classList.add('dimmed');
      requestAnimationFrame(() => detail.classList.add('in'));
    }
    function closeDetail() {
      detail.classList.remove('in');
      detail.hidden = true;
      board.classList.remove('dimmed');
    }

    // --- Clicks ---------------------------------------------------------------
    document.addEventListener('click', (e) => {
      const opener = e.target.closest('[data-open]');
      if (opener) { e.preventDefault(); open(opener.dataset.open); return; }
      if (!mode) return;
      const tab = e.target.closest('.tab');
      if (tab && mode === 'work') { showWork(tab.dataset.tab); return; }
      if (e.target.closest('.back')) { closeDetail(); return; }
      // Click outside the folder closes it (header links still work).
      if (!e.target.closest('#folder') && !e.target.closest('.nav')) close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!detail.hidden) closeDetail(); else close();
    });
    let resizeTimer;
    addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (mode === 'work') showWork(activeTab);
        else if (mode === 'about') showAbout();
      }, 150);
    });
    // #work opens the folder; #work/<tab> opens it on that tab (e.g. #work/art)
    if (location.hash.startsWith('#work')) {
      const t = decodeURIComponent(location.hash.slice(6));
      if (tabs.includes(t)) activeTab = t;
      open('work');
    }
    if (location.hash === '#about') open('about');

    // --- Drag cards; a click without dragging opens the project --------------
    let front = 100;
    function makeDraggable(card) {
      let startX, startY, dx = 0, dy = 0, baseX = 0, baseY = 0, moved = false, down = false;
      card.addEventListener('pointerdown', (e) => {
        down = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        e.preventDefault();
        try { card.setPointerCapture(e.pointerId); } catch {}
        card.style.zIndex = ++front;
      });
      card.addEventListener('pointermove', (e) => {
        if (!down) return;
        dx = e.clientX - startX; dy = e.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; card.classList.add('dragging'); }
        card.style.translate = `${baseX + dx}px ${baseY + dy}px`;
      });
      const end = () => {
        if (!down) return;
        down = false;
        card.classList.remove('dragging');
        baseX += dx; baseY += dy; dx = dy = 0;
      };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
      card.addEventListener('click', () => {
        if (!moved) openDetail(card.project);
        moved = false;
      });
    }
  </script>
</body>
</html>
